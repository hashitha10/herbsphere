<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      html,body{height:100%;margin:0;background:#0f172a;color:#fff}
      .wrap{height:100%;display:flex;align-items:center;justify-content:center}
      model-viewer{width:100%;height:100vh;}
      .controls{position:fixed;left:12px;top:12px;z-index:10}
      .btn{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.08);padding:8px 12px;border-radius:6px;text-decoration:none}
    </style>
  </head>
  <body>
    <div class="controls"><a id="back" class="btn" href="/">Back</a></div>
    <div class="wrap">
      <model-viewer id="mv" camera-controls auto-rotate exposure="1" style="width:100%;height:100vh;background:transparent"></model-viewer>
    </div>

    <script>
      function q(name){const u=new URL(location.href);return u.searchParams.get(name)}
      const src = q('src');
      const mv = document.getElementById('mv');
      if (!src) {
        mv.innerHTML = '<div style="padding:20px;color:#fff">No model specified. Append ?src=/models/your.glb</div>';
      } else {
        mv.setAttribute('src', src);
        // ios quick-look
        const ios = q('ios');
        if (ios) mv.setAttribute('ios-src', ios);
      }
    </script>
  </body>
</html>
